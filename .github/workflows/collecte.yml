# Collecte automatique : MoneyPuck, casinos, Dimers, calendrier → data/
# Les nouveaux fichiers sont commités ; Streamlit Cloud se met à jour tout seul.
name: Collecte quotidienne

on:
  schedule:
    # Heures en UTC ; GitHub ne connaît pas ton fuseau, donc l'heure locale
    # dérive d'une heure au changement d'heure. Chaque paire est faite pour que
    # les deux positions restent bonnes.
    #
    #   8 h 23 UTC → 3 h 23 l'hiver, 4 h 23 l'été. APRÈS les matchs : le départ
    #   le plus tardif de la saison est à 23 h (mardi), donc une fin vers
    #   1 h 40. Résultats, éliminations et modèles MoneyPuck à jour.
    #
    #   22 h 23 UTC → 17 h 23 l'hiver, 18 h 23 l'été. AVANT la mise au jeu :
    #   le premier match commence à 19 h sur 92 % des journées. C'est là que
    #   les cotes valent le plus, gardiens confirmés.
    #
    # Minute 23 plutôt que 0 : GitHub retarde — et finit par abandonner — les
    # runs planifiés au sommet de l'heure, quand sa file est saturée.
    #
    # Le second cron de chaque paire rattrape le premier s'il a été sauté. Il
    # ne coûte rien : DELAI_MINI, dans collect_odds.py, saute l'appel payant
    # quand les cotes ont moins de 4 heures. Deux vraies requêtes par jour,
    # ~124 des 500 crédits gratuits par mois.
    #
    # Trois creneaux par fenetre plutot que deux. Mesure du 1er octobre : les
    # collectes du soir sont parties avec plus de TROIS HEURES de retard, et
    # celle du matin n'est jamais partie. GitHub met les taches planifiees en
    # file et, quand ses runners gratuits saturent, il les retarde lourdement
    # ou les abandonne.
    #
    # Le vrai risque est l'abandon, pas le retard : une collecte decalee reste
    # utilisable, une collecte absente laisse un trou dans la saison. On
    # multiplie donc les chances qu'une parte.
    #
    # Et ca ne coute rien : DELAI_MINI (collect_odds.py) ne laisse payer que la
    # premiere qui demarre reellement dans chaque fenetre. Les autres font tout
    # le reste du travail — MoneyPuck, calendrier, page publique, reveil de
    # l'app — gratuitement. Toujours deux requetes payantes par jour.
    - cron: "23 8 * * *"      # 3 h 23 l'hiver, 4 h 23 l'ete
    - cron: "23 10 * * *"     # 5 h 23 / 6 h 23
    - cron: "23 12 * * *"     # 7 h 23 / 8 h 23
    - cron: "23 20 * * *"     # 15 h 23 / 16 h 23
    - cron: "23 22 * * *"     # 17 h 23 / 18 h 23
    - cron: "23 23 * * *"     # 18 h 23 / 19 h 23, dernier recours
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write           # pour pousser les données collectées

concurrency:
  group: collecte           # jamais deux collectes en même temps
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python daily.py

      # always() : même si une source a échoué, on garde ce qui a été collecté.
      # L'échec de l'étape précédente marque quand même l'exécution en rouge
      # (GitHub t'envoie un courriel).
      - name: Commit des données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/       # docs/ : la page publique (GitHub Pages)
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi
          git commit -m "Collecte du $(TZ=America/Toronto date +%F)"

          # Le rebase sert à ne pas écraser un pick enregistré depuis l'app
          # entre le checkout et le push. Trois tentatives, parce qu'origin
          # peut bouger de nouveau pendant qu'on pousse.
          for essai in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              # Un conflit ici ne peut venir que des instantanés régénérés du
              # jour : deux collectes rapprochées produisent le même .csv.gz
              # avec des octets différents, et git ne sait pas fusionner du
              # binaire. C'est ce qui a fait échouer la collecte le 30
              # septembre. La version du run en cours est la plus récente.
              #
              # Pendant un rebase, --theirs désigne le commit qu'on rejoue,
              # donc le nôtre. L'inverse de l'intuition.
              conflits=$(git diff --name-only --diff-filter=U)
              hors_data=$(echo "$conflits" | grep -v '^data/' || true)
              if [ -n "$hors_data" ]; then
                # picks.json ou du code : jamais de résolution automatique, ce
                # serait écraser du travail humain. On échoue bruyamment.
                git rebase --abort || true
                echo "::error::Conflit hors data/, résolution manuelle requise : $hors_data"
                exit 1
              fi
              echo "Conflit sur les instantanés régénérés, on garde ceux de ce run :"
              echo "$conflits" | sed 's/^/  /'
              git checkout --theirs -- data/
              git add data/
              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              echo "Poussé (tentative $essai)."
              exit 0
            fi
            echo "Push refusé, origin a bougé — nouvelle tentative."
          done

          echo "::error::Trois tentatives de push échouées."
          exit 1

      # Streamlit Cloud eteint l'application apres une periode sans visiteur.
      # J'ai mesure le reveil a 182 secondes : un visiteur venu de Google voit
      # une page blanche pendant trois minutes et repart. Quatre visites par
      # jour suffisent pour qu'elle ne s'endorme jamais.
      #
      # Il faut refaire le trajet d'un vrai navigateur, pas taper l'URL :
      #
      # - le bocal a cookies (-c -b) est indispensable. Streamlit repond 303
      #   vers share.streamlit.io/-/auth/app, qui repose un cookie de session.
      #   Sans le garder, curl rebondit entre les deux adresses jusqu'a
      #   « Maximum (50) redirects followed » et n'atteint jamais l'app.
      # - --max-time 300, parce qu'il faut attendre la FIN du reveil.
      #   Abandonner apres dix secondes laisserait l'application endormie, ce
      #   qui annulerait tout l'interet de l'etape.
      #
      # L'URL est lue dans page.py pour ne pas l'ecrire a deux endroits.
      #
      # continue-on-error : garder le site chaud ne doit jamais faire echouer
      # une collecte de donnees. Mais ce reglage rend l'etape verte meme quand
      # elle echoue — c'est ainsi que la premiere version, cassee, est passee
      # inapercue. D'ou le ::warning:: explicite, visible dans le resume du run.
      - name: Garder l'application eveillee
        if: always()
        continue-on-error: true
        run: |
          url=$(python -c "import page; print(page.APP)")
          jar=$(mktemp)
          echo "Reveil de $url"
          code=$(curl -sL -c "$jar" -b "$jar" -o /dev/null \
                      -w '%{http_code}' --max-redirs 10 --max-time 300 \
                      "$url" || echo "000")
          secondes=$SECONDS
          if [ "$code" = "200" ]; then
            echo "Application eveillee en ${secondes}s (HTTP $code)."
          else
            echo "::warning::Reveil echoue (HTTP $code apres ${secondes}s) : un visiteur venu de Google attendra environ trois minutes."
            exit 1
          fi
